services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: loot_corner
      POSTGRES_PASSWORD: loot_corner_dev_password
      POSTGRES_DB: loot_corner
    ports:
      - "5436:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data:
