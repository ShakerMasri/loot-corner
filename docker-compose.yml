version: "3.8"
services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      - POSTGRES_USER=loot-corner
      - POSTGRES_PASSWORD=itsbeinglooted
      - POSTGRES_DB=loot-corner
    ports:
      - "5436:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data:
